<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motorboat Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Prevents scrollbars from appearing */
        }
        canvas {
            background-color: #3b82f6; /* A nice water blue */
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none; /* Allows clicks to go through to the canvas */
        }
        .controls, .info-panel {
            pointer-events: auto; /* Re-enable pointer events for controls */
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="bg-gray-900 text-white m-0 p-0">

    <div class="relative w-screen h-screen">
        <!-- Canvas for the simulation -->
        <canvas id="simulationCanvas"></canvas>

        <div class="overlay p-4 md:p-6">
            <!-- Top-left Info Panel -->
            <div class="info-panel self-start p-4 rounded-lg shadow-lg">
                <h2 class="text-lg font-bold text-gray-800 mb-2">Vessel Info</h2>
                <div class="grid grid-cols-2 gap-x-4 gap-y-1 text-gray-700">
                    <span>Speed:</span><span id="speedDisplay" class="font-mono text-right">0.0 knots</span>
                    <span>Wind Speed:</span><span id="windSpeedDisplay" class="font-mono text-right">0.0 m/s</span>
                    <span>Wind Dir:</span><span id="windDirDisplay" class="font-mono text-right">0 °</span>
                </div>
            </div>

            <!-- Bottom-center Controls -->
            <div class="controls self-center p-4 rounded-lg shadow-lg mb-4">
                <div class="flex flex-col md:flex-row items-center gap-6">
                    <!-- Throttle Control -->
                    <div class="flex items-center gap-3">
                        <label for="throttle" class="font-medium text-gray-800">Throttle:</label>
                        <input type="range" id="throttle" min="0" max="100" value="0" class="w-40 h-2 bg-gray-300 rounded-lg appearance-none cursor-pointer">
                         <span id="throttleValue" class="font-mono text-gray-800 w-12 text-right">0%</span>
                    </div>
                    <!-- Rudder Control -->
                    <div class="flex items-center gap-3">
                        <label for="rudder" class="font-medium text-gray-800">Rudder:</label>
                        <input type="range" id="rudder" min="-45" max="45" value="0" class="w-40 h-2 bg-gray-300 rounded-lg appearance-none cursor-pointer">
                        <span id="rudderValue" class="font-mono text-gray-800 w-12 text-right">0°</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simulationCanvas');
        const ctx = canvas.getContext('2d');

        // UI Elements
        const throttleSlider = document.getElementById('throttle');
        const rudderSlider = document.getElementById('rudder');
        const throttleValue = document.getElementById('throttleValue');
        const rudderValue = document.getElementById('rudderValue');
        const speedDisplay = document.getElementById('speedDisplay');
        const windSpeedDisplay = document.getElementById('windSpeedDisplay');
        const windDirDisplay = document.getElementById('windDirDisplay');
        
        // --- Simulation Constants ---
        const BOAT_LENGTH = 40;
        const BOAT_WIDTH = 15;
        const MAX_THROTTLE_FORCE = 0.1;
        const WATER_DRAG_COEFFICIENT = 0.985;
        const WIND_INFLUENCE_FACTOR = 0.001;
        const TURN_RATE_FACTOR = 0.005;
        const THROTTLE_KEY_RATE = 0.5; // How fast throttle changes with keys
        const RUDDER_KEY_RATE = 1; // How fast rudder changes with keys

        // --- Simulation State ---
        let boat = { x: 0, y: 0, angle: -Math.PI / 2, speed: 0, vx: 0, vy: 0 };
        let wind = { speed: 0, direction: 0 };
        let controls = { throttle: 0, rudder: 0 };
        let keysPressed = {}; // Object to track currently pressed keys

        // --- Utility Functions ---
        function degreesToRadians(degrees) { return degrees * (Math.PI / 180); }
        function radiansToDegrees(radians) { return (radians * (180 / Math.PI) + 360) % 360; }

        // --- Main Simulation Functions ---
        function initialize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            boat.x = canvas.width / 2;
            boat.y = canvas.height / 2;
            
            generateNewWind();

            // Set up event listeners for controls
            throttleSlider.addEventListener('input', (e) => {
                controls.throttle = parseInt(e.target.value, 10);
            });
            rudderSlider.addEventListener('input', (e) => {
                controls.rudder = parseInt(e.target.value, 10);
            });

            // Keyboard event listeners
            window.addEventListener('keydown', (e) => {
                keysPressed[e.key] = true;
                // Prevent browser from scrolling with arrow keys
                if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
                    e.preventDefault();
                }
            });
            window.addEventListener('keyup', (e) => {
                keysPressed[e.key] = false;
            });
            
            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
            
            setInterval(generateNewWind, 15000);
            animate();
        }

        function generateNewWind() {
            wind.speed = Math.random() * 10;
            wind.direction = Math.random() * 2 * Math.PI;
        }

        /**
         * Reads keyboard input and updates control state.
         */
        function handleKeyboardControls() {
            if (keysPressed['ArrowUp']) {
                controls.throttle = Math.min(100, controls.throttle + THROTTLE_KEY_RATE);
            }
            if (keysPressed['ArrowDown']) {
                controls.throttle = Math.max(0, controls.throttle - THROTTLE_KEY_RATE);
            }
            if (keysPressed['ArrowLeft']) {
                controls.rudder = Math.max(-45, controls.rudder - RUDDER_KEY_RATE);
            }
            if (keysPressed['ArrowRight']) {
                controls.rudder = Math.min(45, controls.rudder + RUDDER_KEY_RATE);
            }
        }

        function update() {
            // 1. Handle keyboard input
            handleKeyboardControls();

            // 2. Calculate engine force based on throttle
            const engineForce = (controls.throttle / 100) * MAX_THROTTLE_FORCE;

            // 3. Calculate forward acceleration
            const forward_ax = Math.cos(boat.angle) * engineForce;
            const forward_ay = Math.sin(boat.angle) * engineForce;
            
            // 4. Update velocity based on acceleration
            boat.vx += forward_ax;
            boat.vy += forward_ay;

            // 5. Apply wind force
            const wind_vx = Math.cos(wind.direction) * wind.speed * WIND_INFLUENCE_FACTOR;
            const wind_vy = Math.sin(wind.direction) * wind.speed * WIND_INFLUENCE_FACTOR;
            boat.vx += wind_vx;
            boat.vy += wind_vy;

            // 6. Apply water drag
            boat.vx *= WATER_DRAG_COEFFICIENT;
            boat.vy *= WATER_DRAG_COEFFICIENT;

            // 7. Update boat's position
            boat.x += boat.vx;
            boat.y += boat.vy;
            
            // 8. Calculate total speed
            boat.speed = Math.sqrt(boat.vx * boat.vx + boat.vy * boat.vy);

            // 9. Adjust boat angle
            const rudderRadians = degreesToRadians(controls.rudder);
            const turnRate = rudderRadians * boat.speed * TURN_RATE_FACTOR;
            boat.angle += turnRate;

            // 10. Handle screen wrapping
            if (boat.x > canvas.width + BOAT_LENGTH) boat.x = -BOAT_LENGTH;
            if (boat.x < -BOAT_LENGTH) boat.x = canvas.width + BOAT_LENGTH;
            if (boat.y > canvas.height + BOAT_LENGTH) boat.y = -BOAT_LENGTH;
            if (boat.y < -BOAT_LENGTH) boat.y = canvas.height + BOAT_LENGTH;

            // 11. Update UI displays
            updateUI();
        }
        
        function draw() {
            ctx.fillStyle = '#3b82f6';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawBoat();
            drawWindIndicator();
        }
        
        function drawBoat() {
            ctx.save();
            ctx.translate(boat.x, boat.y);
            ctx.rotate(boat.angle);

            ctx.fillStyle = '#4B5563';
            ctx.fillRect(-BOAT_LENGTH / 2, -BOAT_WIDTH / 2, BOAT_LENGTH, BOAT_WIDTH);

            ctx.fillStyle = '#D1D5DB';
            ctx.fillRect(-BOAT_LENGTH / 4, -BOAT_WIDTH / 2 + 2, BOAT_LENGTH / 2, BOAT_WIDTH - 4);

            ctx.fillStyle = '#4B5563';
            ctx.beginPath();
            ctx.moveTo(BOAT_LENGTH / 2, -BOAT_WIDTH / 2);
            ctx.lineTo(BOAT_LENGTH / 2 + 15, 0);
            ctx.lineTo(BOAT_LENGTH / 2, BOAT_WIDTH / 2);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }
        
        function drawWindIndicator() {
            const indicatorX = canvas.width - 60;
            const indicatorY = 60;
            const arrowLength = 25 + wind.speed * 2;
            ctx.save();
            ctx.translate(indicatorX, indicatorY);
            ctx.rotate(wind.direction);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.lineWidth = 3;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.beginPath();
            ctx.moveTo(-arrowLength / 2, 0);
            ctx.lineTo(arrowLength / 2, 0);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(arrowLength / 2, 0);
            ctx.lineTo(arrowLength / 2 - 10, -5);
            ctx.lineTo(arrowLength / 2 - 10, 5);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
            ctx.font = '20px sans-serif';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.fillText('W', indicatorX - 8, indicatorY + 8);
        }

        /**
         * Updates all UI elements to reflect the current state.
         */
        function updateUI() {
            // Update sliders to match state
            throttleSlider.value = controls.throttle;
            rudderSlider.value = controls.rudder;
            
            // Update text displays
            const knots = (boat.speed * 10).toFixed(1);
            speedDisplay.textContent = `${knots} knots`;
            throttleValue.textContent = `${Math.round(controls.throttle)}%`;
            rudderValue.textContent = `${Math.round(controls.rudder)}°`;
            windSpeedDisplay.textContent = `${wind.speed.toFixed(1)} m/s`;
            windDirDisplay.textContent = `${Math.round(radiansToDegrees(wind.direction))}°`;
        }

        function animate() {
            update();
            draw();
            requestAnimationFrame(animate);
        }

        window.onload = initialize;
    </script>
</body>
</html>
