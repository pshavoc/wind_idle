<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motorboat Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.7.0/math.js"></script>
    <script src="perlin.js"></script>
    <script src="vector2d.js"></script>
    <script type="module" src="PIDController.js"></script> <!-- Add this line -->

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            /* Prevents scrollbars from appearing */
        }

        canvas {
            background-color: #3b82f6;
            /* A nice water blue */
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            /* Allows clicks to go through to the canvas */
        }

        .controls,
        .info-panel {
            pointer-events: auto;
            /* Re-enable pointer events for controls */
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-autopilot {
            transition: background-color 0.3s ease, color 0.3s ease;
            width: 130px;
            /* Give button a fixed width */
        }

        #debug-display {
            position: absolute;
            top: 100px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            /* Hidden by default */
        }
    </style>
</head>

<body class="bg-gray-900 text-white m-0 p-0">
    <script type="module">

    </script>

    <div class="relative w-screen h-screen">
        <!-- Canvas for the simulation -->
        <canvas id="simulationCanvas"></canvas>

        <div class="overlay p-4 md:p-6">
            <!-- Top-left Info Panel -->
            <div class="info-panel self-start p-4 rounded-lg shadow-lg text-sm">
                <h2 class="text-lg font-bold text-gray-800 mb-2">Vessel Info</h2>
                <div class="grid grid-cols-2 gap-x-4 gap-y-1 text-gray-700">
                    <span>Speed:</span><span id="speedDisplay" class="font-mono text-right">0.0 knots</span>
                    <span>Heading:</span><span id="headingDisplay" class="font-mono text-right">0.0 °</span>
                    <hr class="col-span-2 my-1 border-gray-300">
                    <span>True Wind:</span><span id="windSpeedDisplay" class="font-mono text-right">0.0 m/s</span>
                    <span>(Hidden) Dir:</span><span id="windDirDisplay" class="font-mono text-right">0 °</span>
                    <hr class="col-span-2 my-1 border-gray-300">
                    <span>Est. Wind:</span><span id="estWindSpeedDisplay"
                        class="font-mono text-right text-purple-700 font-semibold">0.0 m/s</span>
                    <span>Est. Dir:</span><span id="estWindDirDisplay"
                        class="font-mono text-right text-purple-700 font-semibold">0 °</span>
                    <hr class="col-span-2 my-1 border-gray-300">
                    <span>Autopilot:</span><span id="autopilotStatus"
                        class="font-mono text-right font-semibold text-red-600">OFF</span>
                </div>
            </div>

            <!-- Bottom-center Controls -->
            <div class="controls self-center p-4 rounded-lg shadow-lg mb-4">
                <div class="flex flex-col md:flex-row items-center gap-6">
                    <!-- Autopilot Button -->
                    <button id="autopilotBtn"
                        class="btn-autopilot bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg">Autopilot
                        OFF</button>
                    <!-- New Wind Button -->
                    <button id="newWindBtn"
                        class="bg-purple-500 hover:bg-purple-600 text-white font-bold py-2 px-4 rounded-lg">New
                        Wind</button>
                    <!-- GPS Toggle Button -->
                    <button id="gpsBtn"
                        class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded-lg">GPS:
                        ON</button>
                    <!-- Compass Toggle Button -->
                    <button id="compassBtn"
                        class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded-lg">Compass:
                        ON</button>
                    <!-- Throttle Control -->
                    <div class="flex items-center gap-3">
                        <label for="throttle" class="font-medium text-gray-800">Throttle:</label>
                        <input type="range" id="throttle" min="-100" max="100" value="0"
                            class="w-40 h-2 bg-gray-300 rounded-lg appearance-none cursor-pointer"
                            title="Negative = reverse">
                        <span id="throttleValue" class="font-mono text-gray-800 w-16 text-right">0%</span>
                    </div>
                    <!-- Rudder Control -->
                    <div class="flex items-center gap-3">
                        <label for="rudder" class="font-medium text-gray-800">Rudder:</label>
                        <input type="range" id="rudder" min="-15" max="15" value="0"
                            class="w-40 h-2 bg-gray-300 rounded-lg appearance-none cursor-pointer">
                        <span id="rudderValue" class="font-mono text-gray-800 w-12 text-right">0°</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="debug-display">
        <p>dx: <span id="dx-value"></span></p>
        <p>dy: <span id="dy-value"></span></p>
        <p>dist: <span id="dist-value"></span></p>
    </div>

    <script type="module" src="app.js"></script>
    <script type="module" src="lsm_mode.js"></script>
    <script type="module" src="utils.js"></script>
    <script src="kalmanFilter.js"></script>

</body>

</html>
