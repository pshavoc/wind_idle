[package]
name = "windpark"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
gomez = "0.5.0"
nalgebra = "0.32"
autodiff_emb = { git = "https://github.com/pshavoc/autodiff_emb.git", branch = "dev", default-features = false, features = ["libm"] }
# num-dual = "0.11"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1.7"

[dev-dependencies]
assert_approx_eq = "1.1"
